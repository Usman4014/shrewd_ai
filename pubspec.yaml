
name: shrewd_ai
description: "SHREWD AI - Buy Smart. Buy Confident."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0
  shared_preferences: ^2.5.6
  dio: ^5.11.1
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  share_plus: ^13.3.1
  intl: ^0.20.3
  connectivity_plus: ^7.3.2
  http_parser: ^4.1.2
  animations: ^3.0.0
  phosphoricons_flutter: ^1.1.1
  package_info_plus: ^10.2.2
  

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_logo.png"
  adaptive_icon_background: "#111318"
  adaptive_icon_foreground: "assets/icons/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
